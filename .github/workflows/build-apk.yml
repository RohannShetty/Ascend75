name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ascend75-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-preview
          name: Ascend 75 v1.0.0 Preview Build
          body: |
            ## Ascend 75 — Android Preview Release
            
            This release contains the latest debug APK compiled directly from the `master`/`main` branch.
            
            ### Included in this build:
            - **4 Challenge Modes**: Strict 75, Flexible 75, 75 Soft, and Custom.
            - **Intelligent Sleep Cutoff**: Configurable sleep boundary (default 3:00 AM) eliminating artificial midnight failures.
            - **Empathetic Reset & Reflection**: In Strict 75, incomplete days capture qualitative lessons and preserve all historical data.
            - **Dual 45-Minute Workout Timer**: Foreground chronometer service with indoor/outdoor tagging and rest separation warnings.
            - **Hydration Tracker**: Paced water logging with hyponatremia rate-limiting safety alerts (>1.2L/hr).
            - **Encrypted Photo Vault**: Hardware-backed AES-256-GCM encryption with Biometric/PIN gate and Before/After split slider.
            - **75-Day Behavioral Science Curriculum**: Pre-seeded evidence cards with DOI/PubMed primary citations.
            - **Sovereign Data Controls**: Offline-first Room persistence and single-tap cryptographic zero-wipe data erasure.
            
            ### Installation:
            Download and install `app-debug.apk` on Android 8.0+ (API 26+) devices.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
