name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit Tests & Architecture Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Persistence Boundary — features must not touch Room or DataStore
        run: |
          if grep -rn "com\.ascend75\.core\.database\|com\.ascend75\.core\.datastore" \
               feature/*/src/main --include=*.kt; then
            echo "::error::A feature module imports persistence directly. Go through :core:domain repositories."
            exit 1
          fi
          echo "Boundary intact: no feature src/main imports :core:database or :core:datastore."

      - name: Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ascend75-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ascend 75 ${{ github.ref_name }}
          body: |
            ## Ascend 75 — Android Release ${{ github.ref_name }}

            Debug APK compiled from tag `${{ github.ref_name }}` by CI, after the unit-test and
            persistence-boundary gates passed.

            ### In this build
            - **Single-owner persistence**: `:core:domain` (contracts) + `:core:data` (Room/DataStore).
              No feature module can reach the database — CI fails the build if one tries.
            - **Type-safe navigation**: `@Serializable` destination keys, no route strings, `MainActivity`
              down to 158 lines.
            - **Atomic day writes**: onboarding, day advancement and the Strict-75 reset each commit
              inside one Room transaction.
            - **Five-Tab Shell**: Today · Trackers · Learn · Vault · More, with `ascend75://task/<id>`
              deep links.
            - **4 Challenge Modes** with the configurable sleep cutoff (default 3:00 AM).
            - **Dual 45-Minute Workout Timer**, hydration tracking with the hyponatremia guard, the
              10-page reading gate, and the AES-256-GCM encrypted photo vault.
            - **75-day behavioural science curriculum** with resolved citations.
            - **Sovereign data controls**: JSON archive export and a zero-fill wipe.
            - **47 unit tests, 0 failures.**

            See `CHANGELOG.md` for the full 1.1.0 entry.

            ### Installation
            Download and install `app-debug.apk` on Android 8.0+ (API 26+) devices.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
