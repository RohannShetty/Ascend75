name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ascend75-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-preview
          name: Ascend 75 v1.0.0 Preview Build
          body: |
            ## Ascend 75 — Android Preview Release
            
            This release contains the latest debug APK compiled directly from the `master`/`main` branch.
            
            ### Included in this build:
            - **Five-Tab Shell**: Today · Trackers · Learn · Vault · More, with a fixed bottom bar, back-to-Today behaviour and `ascend75://task/<id>` deep links. Every implemented screen is now reachable.
            - **Real Day Advancement**: crossing the sleep cutoff materialises the next day with the active mode's habit set and carries custom targets forward; Strict 75 still requires explicit consent.
            - **4 Challenge Modes**: Strict 75, Flexible 75, 75 Soft, and Custom, switchable from the More tab.
            - **Intelligent Sleep Cutoff**: user-configurable day boundary (default 3:00 AM), persisted and reflected on the dashboard.
            - **Dual 45-Minute Workout Timer**: foreground chronometer service, live on-screen countdown, indoor/outdoor tagging, and the 3-hour rest-separation advisory. Sessions are persisted.
            - **Hydration Tracker**: paced water logging with the hyponatremia rate limit (>1.2 L/hr) and a rolling window that survives process death.
            - **Reading Tracker**: 1 Hz session timer, 10-page gate, and persisted reading sessions.
            - **Encrypted Photo Vault**: in-app CameraX capture, hardware AES-256-GCM at rest, biometric/PIN gate, before/after split comparison, real decrypted thumbnails.
            - **75-Day Behavioural Science Curriculum**: 75 unique cards, every citation resolved through Crossref, with bookmarking and in-place detail.
            - **Sovereign Data Controls**: full JSON archive export through `FileProvider`, plus a wipe that zero-fills the vault, truncates every table and destroys the Keystore master key.
            - **Smoothness Pass**: single-owner day flow, lifecycle-aware state collection, tightened recomposition scope, and a branded `#0F131C` cold start instead of a platform-grey window.
            - **Web Prototype** (`web/`): the same five tabs and design tokens as a React + Vite reference build.
            
            ### Installation:
            Download and install `app-debug.apk` on Android 8.0+ (API 26+) devices.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
